# Keeps a "Version packages" pull request with what `jpm changeset version` makes of the pending changesets
# (.changeset/). Merging it bumps the version in project.jsonc, and CI (ci.yml) then releases that version as
# it always has: tag, binaries, GitHub release (with the CHANGELOG.md entry as notes) and dev.jpm:jpm-api.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version pull request
    runs-on: ubuntu-latest
    steps:
      # the same token for git: changeset-action pushes the version branch with the credentials checkout
      # stores, and a push made with github.token starts no workflows either
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESET_TOKEN || github.token }}
      # with no changesets left (the version pull request was just merged) the action would publish and tag,
      # which is CI's job (ci.yml), so it runs only while there are changesets
      - id: pending
        run: echo "any=$(find .changeset -name '*.md' 2>/dev/null | head -n 1)" >> "$GITHUB_OUTPUT"
      # jpm built from this commit, as CI (ci.yml) builds and checks it: `jpm changeset version` installs, and a
      # released jpm can write project.lock differently (0.13.0 left out the "pom" pins), which CI's
      # `--frozen` then refuses
      - if: steps.pending.outputs.any != ''
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: ""
      - if: steps.pending.outputs.any != ''
        name: jpm from source
        run: |
          ./bootstrap.sh
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - if: steps.pending.outputs.any != ''
        uses: java-package-manager/changeset-action@v1
        with:
          # a token of its own, so CI runs on the pull request (one opened with github.token starts no workflows)
          github-token: ${{ secrets.CHANGESET_TOKEN || github.token }}
