name: CI

on:
  # Releases are not started by tags: CI creates the tag when the version changes (see the version job).
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs first and decides what this run publishes (outputs.kind):
  #   release  the main branch has a version that has no tag yet: CI tags this commit and releases it
  #   canary   any other push to the main branch: <version>-<commit>
  #   none     pull requests and other branches
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide between a release and a canary build
        id: decide
        run: |
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' project.jsonc | head -n 1)
          kind=none
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
              kind=canary
            else
              kind=release
              echo "::notice::$version has no release yet: releasing it"
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "This run: $kind ($version)"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, exe: "" }
          - { name: macos-arm64, os: macos-latest, exe: "" }
          - { name: macos-x64, os: macos-15-intel, exe: "" }
          - { name: windows-x64, os: windows-latest, exe: ".exe" }
    defaults:
      run:
        shell: bash
    env:
      JPM_HOME: ${{ github.workspace }}/../jpm-home
      # smoke tests run jpm --version a lot; they should not ask GitHub for newer versions each time
      JPM_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      # Every commit on the main branch is released as a canary build, versioned <version>-<commit>.
      - name: Stamp the canary version
        if: needs.version.outputs.kind == 'canary'
        run: |
          v=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' project.jsonc | head -n 1)
          canary="$v-${GITHUB_SHA::7}"
          perl -pi -e 'if (!$done && s/"version": "\Q'"$v"'\E"/"version": "'"$canary"'"/) { $done = 1 }' project.jsonc
          grep -q "\"version\": \"$canary\"" project.jsonc
          echo "Canary build $canary"

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: ""

      - name: Cache jpm downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../jpm-home/repository
          key: jpm-${{ matrix.name }}-${{ hashFiles('project.lock') }}
          restore-keys: jpm-${{ matrix.name }}-

      - name: Bootstrap
        run: ./bootstrap.sh

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"

      # build, unit and end-to-end tests, the schema check and the ratchets: what bin/check runs locally
      - name: Checks
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install --quiet jsonschema
          bin/check

      - name: Native image
        run: bin/jpm build --native

      - name: Performance budget
        if: matrix.name == 'linux-x64'
        run: checks/perf.sh cli/dist/jpm

      - name: End-to-end tests on the native binary
        if: runner.os != 'Windows'
        run: JPM_E2E_BINARY="$PWD/cli/dist/jpm" bin/jpm test --frozen dev.jpm.e2e.EndToEndTest dev.jpm.e2e.ApiTest dev.jpm.e2e.ClientTest

      - name: Smoke test the native binary
        run: |
          set -eux
          JPM="$PWD/cli/dist/jpm${{ matrix.exe }}"
          "$JPM" --version
          "$JPM" java list
          work="$RUNNER_TEMP/smoke"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"
          "$JPM" init smoke
          "$JPM" add org.apache.commons:commons-lang3@3.14.0
          "$JPM" add --dev org.projectlombok:lombok@1.18.34
          cat > src/smoke/App.java <<'EOF'
          package smoke;

          public class App {
              @lombok.Value
              static class Pair { String a; String b; }

              public static String greeting() {
                  return "Hello from smoke!";
              }

              public static void main(String[] args) {
                  System.out.println(greeting() + " " + org.apache.commons.lang3.StringUtils.reverse("ok")
                      + " " + new Pair("x", "y"));
              }
          }
          EOF
          "$JPM" build
          "$JPM" start | tee out.txt
          grep -q "Hello from smoke! ko App.Pair(a=x, b=y)" out.txt
          "$JPM" test
          "$JPM" install --frozen
          "$JPM" why org.apache.commons:commons-lang3

      - name: Smoke test toolchains and native builds
        run: |
          set -eux
          JPM="$PWD/cli/dist/jpm${{ matrix.exe }}"
          mkdir -p "$RUNNER_TEMP/bin"
          JVM="$RUNNER_TEMP/bin/jvm${{ matrix.exe }}"
          cp "$JPM" "$JVM"
          "$JVM" exec temurin-17 -- java -version 2>&1 | tee jv.txt
          grep -q 'version "17' jv.txt
          "$JPM" java install zulu-21
          "$JPM" java list
          "$JPM" java remove zulu-21
          cd "$RUNNER_TEMP/smoke"
          "$JPM" start --trace
          test -f src/assets/META-INF/native-image/smoke/smoke/reflect-config.json
          "$JPM" build --native
          ./dist/smoke${{ matrix.exe }} | tee native.txt
          grep -q "Hello from smoke! ko App.Pair(a=x, b=y)" native.txt

      - name: Import real Maven and Gradle builds
        run: |
          set -eux
          JPM="$PWD/cli/dist/jpm${{ matrix.exe }}"
          work="$RUNNER_TEMP/imports"
          rm -rf "$work" && mkdir -p "$work"
          # A real-world Maven project: parent POM chain, managed versions, Java 8 target.
          git clone -q --depth 1 --branch rel/commons-lang-3.17.0 https://github.com/apache/commons-lang.git "$work/commons-lang"
          (cd "$work/commons-lang" && "$JPM" import && "$JPM" build && test -f dist/commons-lang3-3.17.0.jar)
          # A Gradle build, read by running Gradle ...
          cp -r fixtures/gradle-demo "$work/gradle-model"
          (cd "$work/gradle-model" && "$JPM" import && "$JPM" build && "$JPM" test && cd app && "$JPM" start | tee out.txt && grep -q "core,lombok,ObjectMapper" out.txt)
          # ... and as text, without running anything.
          cp -r fixtures/gradle-demo "$work/gradle-static"
          (cd "$work/gradle-static" && "$JPM" import --static && "$JPM" build && cd app && "$JPM" start | grep -q "core,lombok,ObjectMapper")

      - name: Git dependencies by tag, branch name and #branch
        if: runner.os != 'Windows'
        run: |
          set -eux
          JPM="$PWD/cli/dist/jpm${{ matrix.exe }}"
          base="$RUNNER_TEMP/gitbase"; rm -rf "$base" && mkdir -p "$base/me"
          git init -q -b main "$base/me/lib" && cd "$base/me/lib"
          git config user.email ci@example.com && git config user.name ci
          for v in 1.0.0 1.1.0; do
            printf '{ "name": "lib", "version": "%s" }\n' "$v" > project.jsonc
            mkdir -p src/lib && echo "package lib; public class Lib {}" > src/lib/Lib.java
            git add -A && git commit -qm "$v"
            [ "$v" = 1.0.0 ] && git tag 1.0.0
          done
          head=$(git rev-parse --short main)
          export JPM_GIT_BASE_GITHUB="file://$base/"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          for spec in main '#main' 1.0.0; do
            printf '{ "name": "c", "version": "1.0.0", "runtime": { "github:me/lib": "%s" } }\n' "$spec" > project.jsonc
            rm -f project.lock && "$JPM" install
          done
          grep -q '"version": "1.0.0"' project.lock
          printf '{ "name": "c", "version": "1.0.0", "runtime": { "github:me/lib": "main" } }\n' > project.jsonc
          rm -f project.lock && "$JPM" install && grep -q "1.1.0+$head" project.lock

      - name: Build and run a jar-in-jar bundle
        run: |
          set -eux
          JPM="$PWD/cli/dist/jpm${{ matrix.exe }}"
          cp -r fixtures/bundle-demo "$RUNNER_TEMP/bundle-demo"
          cd "$RUNNER_TEMP/bundle-demo"
          "$JPM" build
          java -jar app/dist/app-1.0.0-bundle.jar | tee out.txt
          grep -q "Hello Bundle" out.txt
          grep -q "implementation dependencies visible to the app: false" out.txt

      - name: Test the install script against this build
        run: |
          set -eux
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel"
          cp "cli/dist/jpm${{ matrix.exe }}" "$rel/jpm-${{ matrix.name }}${{ matrix.exe }}"
          cd "$rel" && (sha256sum * 2>/dev/null || shasum -a 256 *) > SHA256SUMS && cat SHA256SUMS
          if [ "${{ matrix.exe }}" = "" ]; then
            # a fresh home, so the PATH setup is checked without touching the runner's
            home="$RUNNER_TEMP/home" && mkdir -p "$home"
            # as a user runs it: no JPM_HOME, so it installs into ~/.jpm/bin of that home
            env -u JPM_HOME HOME="$home" SHELL=/bin/bash JPM_INSTALL_BASE="file://$rel" sh "$GITHUB_WORKSPACE/install.sh"
            env -u JPM_HOME HOME="$home" SHELL=/bin/bash JPM_INSTALL_BASE="file://$rel" sh "$GITHUB_WORKSPACE/install.sh"
            test "$(grep -c '.jpm/env' "$home/.bashrc")" = 1
            # something later in the startup file puts another JDK first; jpm must still win at the prompt
            mkdir -p "$home/otherjdk/bin" && printf '#!/bin/sh\necho other-jdk\n' > "$home/otherjdk/bin/java" && chmod +x "$home/otherjdk/bin/java"
            echo 'export PATH="$HOME/otherjdk/bin:$PATH"' >> "$home/.bashrc"
            printf 'command -v java\n' | env -u JPM_HOME HOME="$home" bash -i 2>/dev/null | tee which.txt
            grep -q '.jpm/bin/java' which.txt
            if command -v zsh >/dev/null; then
              env -u JPM_HOME HOME="$home" SHELL="$(command -v zsh)" "$home/.jpm/bin/jpm" jvm setup --no-shims
              echo 'export PATH="$HOME/otherjdk/bin:$PATH"' >> "$home/.zshrc"
              printf 'command -v java\n' | env -u JPM_HOME HOME="$home" zsh -i 2>/dev/null | tee which.txt
              grep -q '.jpm/bin/java' which.txt
            fi
            # take the competing JDK out again: the checks below run single commands (`bash -ic`), which show
            # no prompt, so the prompt hook does not run for them
            for f in "$home/.bashrc" "$home/.zshrc"; do
              [ -f "$f" ] && grep -v 'otherjdk' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            done
            env -u JPM_HOME HOME="$home" bash -ic 'command -v jpm && jvm list && jpm --version'
            # the java shim: inside a project its "java", elsewhere `jvm use`, otherwise the java already on PATH
            test -L "$home/.jpm/bin/java"
            mkdir -p "$home/proj" && printf '{ "name": "p", "version": "1.0.0", "java": "17" }\n' > "$home/proj/project.jsonc"
            (cd "$home/proj" && env -u JPM_HOME HOME="$home" bash -ic 'java -version' 2>&1 | tee v.txt && grep -q 'version "17' v.txt)
            (cd "$home/proj" && env -u JPM_HOME HOME="$home" bash -ic 'jvm current' | grep -q 'temurin-17')
            (cd "$home" && env -u JPM_HOME HOME="$home" bash -ic 'jvm use 11 && java -version' 2>&1 | tee v.txt && grep -q 'version "11' v.txt)
            (cd "$home/proj" && env -u JPM_HOME HOME="$home" bash -ic 'java -version' 2>&1 | grep -q 'version "17')
            # jpm upgrade: a release that is newer gets installed in place, the same version is a no-op
            v=$("$home/.jpm/bin/jpm" --version | cut -d' ' -f2)
            echo "$v" > "$rel/VERSION"
            env -u JPM_HOME HOME="$home" JPM_INSTALL_BASE="file://$rel" "$home/.jpm/bin/jpm" upgrade 2>&1 | grep -q "already the latest"
            echo "99.0.0" > "$rel/VERSION"
            env -u JPM_HOME HOME="$home" JPM_INSTALL_BASE="file://$rel" "$home/.jpm/bin/jpm" upgrade --check 2>&1 | grep -q "99.0.0 is available"
            env -u JPM_HOME HOME="$home" JPM_INSTALL_BASE="file://$rel" "$home/.jpm/bin/jpm" upgrade 2>&1 | tee up.txt
            grep -q "Upgraded" up.txt
            test -L "$home/.jpm/bin/java" && "$home/.jpm/bin/jpm" --version
          fi

      - name: Test install.ps1 against this build
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:JPM_HOME = Join-Path $env:RUNNER_TEMP 'inst'
          $env:JPM_INSTALL_BASE = ([Uri](Join-Path $env:RUNNER_TEMP 'release')).AbsoluteUri
          & "$env:GITHUB_WORKSPACE\install.ps1"
          & (Join-Path $env:JPM_HOME 'bin\jvm.exe') list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if (-not (($userPath -split ';') -contains (Join-Path $env:JPM_HOME 'bin'))) { throw "install.ps1 did not add jpm to the user PATH" }
          if (-not (Test-Path (Join-Path $env:JPM_HOME 'bin\java.exe'))) { throw "install.ps1 did not create the java shim" }
          $proj = Join-Path $env:RUNNER_TEMP 'shimproj'
          New-Item -ItemType Directory -Force $proj | Out-Null
          Set-Content (Join-Path $proj 'project.jsonc') '{ "name": "p", "version": "1.0.0", "java": "17" }'
          Push-Location $proj
          $ErrorActionPreference = 'Continue'
          $v = & (Join-Path $env:JPM_HOME 'bin\java.exe') -version 2>&1 | Out-String
          $ErrorActionPreference = 'Stop'
          Pop-Location
          Write-Host $v
          if ($v -notmatch 'version "17') { throw "the java shim did not use the project's JDK" }
          # jpm upgrade replaces the running jpm.exe and re-links the shims
          Set-Content (Join-Path $env:RUNNER_TEMP 'release\VERSION') '99.0.0'
          $ErrorActionPreference = 'Continue'
          & (Join-Path $env:JPM_HOME 'bin\jpm.exe') upgrade 2>&1 | Out-Host
          $upgradeExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($upgradeExit -ne 0) { throw "jpm upgrade failed" }
          Push-Location $proj
          $ErrorActionPreference = 'Continue'
          $v = & (Join-Path $env:JPM_HOME 'bin\java.exe') -version 2>&1 | Out-String
          $ErrorActionPreference = 'Stop'
          Pop-Location
          if ($v -notmatch 'version "17') { throw "the java shim broke after jpm upgrade" }

      - uses: actions/upload-artifact@v7
        with:
          name: jpm-${{ matrix.name }}
          path: cli/dist/jpm${{ matrix.exe }}
          if-no-files-found: error

  # Tests tagged "live" reach Maven Central; every other test is hermetic and runs in the build job.
  live-tests:
    name: live tests
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      JPM_HOME: ${{ github.workspace }}/../jpm-home
      JPM_NO_UPDATE_CHECK: "1"
      JPM_E2E_BINARY: ${{ github.workspace }}/.cache/native/jpm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jpm-linux-x64
          path: .cache/native
      - run: chmod +x .cache/native/jpm
      - name: Live tests
        run: .cache/native/jpm test --frozen --tag live

  # A pull request that changes a module needs a changeset (`jpm changeset add`), so the release notes have it.
  changesets:
    name: changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: java-package-manager/setup-jpm@v1
      - run: jpm changeset status --check --since "origin/${{ github.base_ref }}"

  java-versions:
    name: java versions
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      JPM_HOME: ${{ github.workspace }}/../jpm-home
      JPM_NO_UPDATE_CHECK: "1"
      JPM_E2E_BINARY: ${{ github.workspace }}/.cache/native/jpm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jpm-linux-x64
          path: .cache/native
      - run: chmod +x .cache/native/jpm
      # jpm installs the JDKs itself (foojay, checksums verified), as users get them.
      - name: Install the JDKs
        run: |
          set -e
          homes=""
          # 8 is pinned to 8u512: GitHub's download of 8u514 (re-uploaded by Adoptium on 2026-11-19) still serves a
          # file whose checksum does not match the published one on some runners
          for v in 8.0.512 11 17 21 25 27; do
            .cache/native/jpm java install "temurin-$v"
            homes="$homes${homes:+:}$(.cache/native/jpm java home "temurin-$v" | tail -n 1)"
          done
          echo "JPM_TEST_JDKS=$homes" >> "$GITHUB_ENV"
      - name: Every target with every JDK
        run: .cache/native/jpm test --frozen --module jpm dev.jpm.e2e.JavaVersionsTest

  # Line coverage of the unit and end-to-end tests, to find dead code: the report is an artifact, the
  # summary is shown on the run's page. The end-to-end tests run jpm's classes (no JPM_E2E_BINARY), so the
  # coverage agent sees them.
  coverage:
    name: coverage
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      JPM_HOME: ${{ github.workspace }}/../jpm-home
      JPM_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jpm-linux-x64
          path: .cache/native
      - run: chmod +x .cache/native/jpm
      - name: Tests with coverage
        run: JPM=.cache/native/jpm checks/coverage.sh
      - name: Summary
        if: always()
        run: cat .cache/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            .cache/coverage/html
            .cache/coverage/coverage.xml
            .cache/coverage/summary.md

  publish-api:
    name: publish api
    if: needs.version.outputs.kind != 'none'
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      JPM_PUBLISH_THENEXTLVL_USERNAME: ${{ secrets.JPM_PUBLISH_THENEXTLVL_USERNAME }}
      JPM_PUBLISH_THENEXTLVL_PASSWORD: ${{ secrets.JPM_PUBLISH_THENEXTLVL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jpm-linux-x64
      - name: Publish
        run: |
          chmod +x jpm
          if [ '${{ needs.version.outputs.kind }}' = canary ]; then
            sed -i '0,/"version": "[^"]*"/s//"version": "${{ needs.version.outputs.version }}-SNAPSHOT"/' project.jsonc
          fi
          ./jpm publish thenextlvl --module jpm-api

  release:
    name: release
    if: needs.version.outputs.kind == 'release'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release files
        run: .github/release-files.sh "$VERSION"

      - name: Publish
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::$VERSION is already released"
            exit 0
          fi
          # creates the tag on this commit when the release was started by a version change
          # 1.0.0-rc1 and the like are prereleases: they never become releases/latest
          pre=""; case "$VERSION" in *-*) pre="--prerelease" ;; esac
          # the notes are the version's entry in cli/CHANGELOG.md (written by `jpm changeset version`), else generated
          notes="--generate-notes"
          awk -v v="## $VERSION" '$0 == v {on = 1; next} on && /^## / {exit} on' cli/CHANGELOG.md 2>/dev/null > release-notes.md || true
          if [ -s release-notes.md ]; then notes="--notes-file release-notes.md"; fi
          gh release create "$VERSION" release/* $pre --target "$GITHUB_SHA" --title "jpm $VERSION" $notes

      - name: Point the canary release at it
        # the newest build is this release, so `jpm upgrade --canary` installs it too
        run: |
          printf '%s\n' "$VERSION" > VERSION
          gh release view canary >/dev/null 2>&1 || gh release create canary --prerelease --title "jpm canary" \
            --notes "Names the newest canary build in VERSION, for \`jpm upgrade --canary\`. The builds themselves are the <version>-<commit> prereleases."
          gh release upload canary VERSION --clobber

  # A prerelease for every commit on the main branch, tagged <version>-<commit>. The release tagged
  # "canary" holds a VERSION file naming the newest one, which `jpm upgrade --canary` reads. Prereleases
  # never become releases/latest, so stable installs and upgrades are not affected.
  canary:
    name: canary
    if: needs.version.outputs.kind == 'canary'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: canary
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release files
        run: |
          v=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' project.jsonc | head -n 1)
          echo "CANARY=$v-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          .github/release-files.sh "$v-${GITHUB_SHA::7}"

      - name: Publish the canary build
        run: |
          if gh release view "$CANARY" >/dev/null 2>&1; then
            echo "$CANARY is already released"
          else
            gh release create "$CANARY" release/* --prerelease --target "$GITHUB_SHA" --title "jpm $CANARY (canary)" \
              --notes "Canary build of $GITHUB_SHA on ${{ github.event.repository.default_branch }}. Install it with \`jpm upgrade --canary\` or \`JPM_VERSION=canary\` for the install script."
          fi

      - name: Point the canary release at it
        run: |
          printf '%s\n' "$CANARY" > VERSION
          gh release view canary >/dev/null 2>&1 || gh release create canary --prerelease --title "jpm canary" \
            --notes "Names the newest canary build in VERSION, for \`jpm upgrade --canary\`. The builds themselves are the <version>-<commit> prereleases."
          gh release upload canary VERSION --clobber

      - name: Keep the newest ten canary builds
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^[0-9][^ ]*-[0-9a-f]{7}$")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting old canary $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
